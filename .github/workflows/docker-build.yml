# Proves the workspace still builds from a clean checkout: rosdep + colcon build
# inside the same image the team uses (see Dockerfile).
name: Docker Build

on:
  push:
    branches: [main]
    paths: ["ros2/**", "Dockerfile", ".dockerignore", ".github/workflows/docker-build.yml"]
  pull_request:
    branches: [main]
    paths: ["ros2/**", "Dockerfile", ".dockerignore", ".github/workflows/docker-build.yml"]
  workflow_dispatch:

jobs:
  docker_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (rosdep + colcon build)
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: ROS_DISTRO=jazzy
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
